    language: zh-CN
    authority_language: zh-CN
    historical: mutable
    navigation: fixed-entry

  - id: root-privacy-en
    path: PRIVACY.md
    category: user
    language: en-US
    authority_language: zh-CN
    translation_of: PRIVACY.zh-CN.md
    historical: mutable
    navigation: fixed-entry

  - id: docs-index
    path: docs/index.md
    category: navigation
    language: zh-CN
    authority_language: zh-CN
    historical: mutable
    navigation: docs-index

  - id: architecture-documents
