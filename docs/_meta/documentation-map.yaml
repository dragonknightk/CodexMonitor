version: 2

documents:
  - id: pull-request-template
    path: .github/PULL_REQUEST_TEMPLATE.md
    category: fixed-entry
    language: zh-CN
    authority_language: zh-CN
    historical: mutable
    navigation: fixed-entry

  - id: root-readme-zh
    path: README.md
    category: user
    language: zh-CN
    authority_language: zh-CN
    historical: mutable
    navigation: fixed-entry

  - id: root-readme-en
    path: README.en.md
    category: user
    language: en-US
    authority_language: zh-CN
    translation_of: README.md
    historical: mutable
    navigation: fixed-entry

  - id: root-privacy-zh
    path: PRIVACY.zh-CN.md
