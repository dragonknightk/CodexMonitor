generated:
  - id: telemetry-field-reference
    authority: docs/_meta/telemetry-fields.yaml
    outputs:
      - docs/reference/telemetry-fields.md
    command: node scripts/generate-telemetry-fields.mjs --persistence-manifest crates/codex-monitor-core/telemetry-persistence-fields.yaml
    check: node scripts/generate-telemetry-fields.mjs --check --persistence-manifest crates/codex-monitor-core/telemetry-persistence-fields.yaml

  - id: telemetry-source-reference
    authority: docs/_meta/telemetry-sources.yaml
    outputs:
      - docs/reference/telemetry-sources.md
    command: node scripts/generate-references.mjs
    check: node scripts/generate-references.mjs --check

  - id: openapi-typescript-client
    authority: api/openapi.yaml
    outputs:
      - web/src/api/schema.d.ts
    command: pnpm --dir web generate:api
    check: pnpm check:api

  - id: database-schema-reference
    authority: crates/codex-monitor-storage/migrations
    outputs:
      - docs/reference/database-schema.md
    command: node scripts/generate-database-schema.mjs
    check: node scripts/generate-database-schema.mjs --check

mappings:
  - id: workspace-and-toolchain
    globs:
      - Cargo.toml
      - rust-toolchain.toml
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/**
    required:
      - docs/architecture/system-overview.md
      - docs/development/commands.md
    optional:
      - docs/development/testing.md
      - docs/development/security-and-privacy-audits.md
    checks:
      - pnpm verify

  - id: core-domain
    globs:
      - crates/codex-monitor-core/**
    required:
      - docs/domain/monitoring-model.md
      - docs/reference/telemetry-fields.md
    optional:
      - PRIVACY.md
      - PRIVACY.zh-CN.md
    generators:
      - telemetry-field-reference
    checks:
      - cargo test -p codex-monitor-core

  - id: telemetry-field-catalog
    globs:
      - docs/_meta/telemetry-fields.yaml
      - crates/codex-monitor-core/telemetry-persistence-fields.yaml
      - scripts/generate-telemetry-fields.mjs
      - scripts/tests/telemetry-fields.test.mjs
    required:
      - docs/reference/telemetry-fields.md
      - docs/domain/monitoring-model.md
    generators:
      - telemetry-field-reference
    checks:
      - node scripts/generate-telemetry-fields.mjs --check --persistence-manifest crates/codex-monitor-core/telemetry-persistence-fields.yaml
      - node --test scripts/tests/telemetry-fields.test.mjs

  - id: engine-runtime
    globs:
      - crates/codex-monitor-engine/**
    required:
      - docs/architecture/system-overview.md
      - docs/reference/database-schema.md
    optional:
      - docs/reference/telemetry-sources.md
      - PRIVACY.md
      - PRIVACY.zh-CN.md
    checks:
      - cargo test -p codex-monitor-engine

  - id: database-schema
    globs:
      - crates/codex-monitor-storage/migrations/**
      - scripts/generate-database-schema.mjs
      - scripts/tests/database-schema-generation.test.mjs
    required:
      - docs/reference/database-schema.md
      - docs/development/documentation-workflow.md
    optional:
      - docs/how-to/add-database-migration.md
      - docs/architecture/system-overview.md
    generators:
      - database-schema-reference
    checks:
      - node scripts/generate-database-schema.mjs --check
      - node --test scripts/tests/database-schema-generation.test.mjs

  - id: desktop-host
    globs:
      - apps/desktop/**
    required:
      - docs/architecture/process-lifecycle.md
    optional:
      - docs/architecture/system-overview.md
    checks:
      - cargo check -p codex-monitor-desktop

  - id: packaged-user-behavior
    globs:
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/src/startup.rs
      - apps/desktop/src-tauri/src/lib.rs
      - apps/desktop/src-tauri/src/autostart.rs
      - apps/desktop/src-tauri/src/tray.rs
      - apps/desktop/src-tauri/src/notification.rs
      - crates/codex-monitor-storage/src/paths.rs
      - crates/codex-monitor-storage/src/legacy_import.rs
      - crates/codex-monitor-storage/src/legacy_import/**
      - .github/workflows/*release*.yml
      - .github/workflows/*release*.yaml
      - .github/workflows/*artifact*.yml
      - .github/workflows/*artifact*.yaml
      - .github/workflows/*package*.yml
      - .github/workflows/*package*.yaml
      - scripts/*release*
      - scripts/*package*
      - scripts/installed-artifact-smoke.mjs
    required:
      - README.md
      - README.en.md
      - PRIVACY.md
      - PRIVACY.zh-CN.md
      - docs/user/installation.md
      - docs/user/installation.zh-CN.md
      - docs/user/upgrade.md
      - docs/user/upgrade.zh-CN.md
      - docs/user/uninstall.md
      - docs/user/uninstall.zh-CN.md
      - docs/user/troubleshooting.md
      - docs/user/troubleshooting.zh-CN.md
    optional:
      - docs/index.md
      - docs/development/commands.md
      - docs/development/testing.md
    checks:
      - pnpm docs:check

  - id: dashboard
    globs:
      - web/src/**
      - web/index.html
      - web/vite.config.ts
    required:
      - docs/architecture/system-overview.md
    optional:
      - docs/how-to/add-locale.md
      - docs/development/testing.md
    checks:
      - pnpm --dir web lint
      - pnpm --dir web test:unit

  - id: openapi-contract
    globs:
      - api/openapi.yaml
      - scripts/check-generated-api.mjs
      - scripts/tests/generated-api.test.mjs
      - web/src/api/schema.d.ts
    required:
      - docs/architecture/system-overview.md
      - docs/development/documentation-workflow.md
    optional:
      - docs/how-to/add-telemetry-field.md
      - docs/development/testing.md
    generators:
      - openapi-typescript-client
    checks:
      - pnpm check:api

  - id: repository-fixture-privacy
    globs:
      - fixtures/**
      - contracts/legacy-otlp-v1*.json
      - scripts/check-repository-fixtures.mjs
      - scripts/tests/repository-fixtures.test.mjs
    required:
      - docs/development/documentation-workflow.md
      - docs/development/legacy-contract-cutover.md
      - docs/development/fixtures.md
    optional:
      - docs/development/testing.md
      - docs/development/security-and-privacy-audits.md
      - PRIVACY.md
      - PRIVACY.zh-CN.md
    checks:
      - node scripts/check-repository-fixtures.mjs
      - node --test scripts/tests/repository-fixtures.test.mjs

  - id: atomic-runtime-cutover
    globs:
      - pyproject.toml
      - run.ps1
      - src/codex_monitor/**
      - tests/test_server.py
      - tests/legacy_contract/**
      - scripts/check-codex-otel.ps1
      - scripts/install-codex-otel-snippet.ps1
      - scripts/smoke-test-json.ps1
      - scripts/check-no-legacy-runtime.mjs
      - scripts/tests/no-legacy-runtime.test.mjs
    required:
      - docs/development/legacy-contract-cutover.md
      - docs/architecture/system-overview.md
    optional:
      - docs/development/commands.md
      - docs/development/testing.md
    checks:
      - pnpm check:no-legacy-runtime
      - node --test scripts/tests/no-legacy-runtime.test.mjs

  - id: source-catalog
    globs:
      - docs/_meta/telemetry-sources.yaml
    required:
      - docs/reference/telemetry-sources.md
    generators:
      - telemetry-source-reference
    checks:
      - node scripts/generate-references.mjs --check

  - id: documentation-governance
    globs:
      - scripts/check-docs.mjs
      - scripts/generate-references.mjs
      - scripts/generate-telemetry-fields.mjs
      - scripts/tests/**
      - scripts/read-docs-impact.mjs
      - docs/_meta/documentation-map.yaml
    required:
      - docs/development/documentation-workflow.md
    optional:
      - docs/index.md
    checks:
      - pnpm docs:check

  - id: security-and-privacy-audits
    globs:
      - .gitleaks.toml
      - deny.toml
      - scripts/check-frontend-licenses.mjs
      - scripts/check-privacy-surfaces.mjs
      - docs/_meta/privacy-surfaces.yaml
    required:
      - docs/development/security-and-privacy-audits.md
    optional:
      - docs/development/commands.md
      - docs/development/testing.md
      - PRIVACY.md
      - PRIVACY.zh-CN.md
    checks:
      - pnpm check:privacy
      - pnpm audit:security
