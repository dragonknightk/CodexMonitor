<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">CodexMonitor</title>
  <desc id="banner-desc">Local-only Codex token usage and reasoning pattern monitor powered by Rust, Tauri 2, SQLite, and React.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132c22" />
      <stop offset="55%" stop-color="#0d1d17" />
      <stop offset="100%" stop-color="#09130f" />
    </linearGradient>
    <linearGradient id="icon-bg" x1="64" y1="68" x2="232" y2="252" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4435" />
      <stop offset="100%" stop-color="#0d1713" />
    </linearGradient>
    <linearGradient id="signal" x1="100" y1="100" x2="200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c6f36b" />
      <stop offset="100%" stop-color="#4fc68b" />
    </linearGradient>
    <linearGradient id="card-border" x1="820" y1="48" x2="1144" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4fc68b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#c6f36b" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#285241" stroke-width="2" />

  <!-- Subtle Background Grid Accents -->
  <g stroke="#1e3f32" stroke-width="1" opacity="0.45">
    <line x1="780" y1="0" x2="780" y2="320" />
    <line x1="960" y1="0" x2="960" y2="320" />
    <line x1="740" y1="80" x2="1200" y2="80" />
    <line x1="740" y1="160" x2="1200" y2="160" />
    <line x1="740" y1="240" x2="1200" y2="240" />
  </g>

  <!-- App Icon Badge -->
  <rect x="56" y="68" width="184" height="184" rx="44" fill="url(#icon-bg)" stroke="#2c5b48" stroke-width="2" />
  <path
    d="M103 160c0-25 20-45 45-45 18.5 0 34.4 11.1 41.4 27"
    fill="none"
    stroke="url(#signal)"
    stroke-linecap="round"
    stroke-width="14.5"
  />
  <path
    d="M193 160c0 25-20 45-45 45-18.5 0-34.4-11.1-41.4-27"
    fill="none"
    stroke="url(#signal)"
    stroke-linecap="round"
    stroke-width="14.5"
  />
  <circle cx="148" cy="160" r="14.5" fill="#f1f7e9" />
  <circle cx="103" cy="160" r="7.6" fill="#c6f36b" />
  <circle cx="193" cy="160" r="7.6" fill="#4fc68b" />

  <!-- Eyebrow Tag -->
  <rect x="276" y="70" width="276" height="28" rx="14" fill="#173529" stroke="#2f644e" stroke-width="1" />
  <circle cx="294" cy="84" r="4.5" fill="#c6f36b" />
  <text x="308" y="89" fill="#c6f36b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">LOCAL OTLP TELEMETRY MONITOR</text>

  <!-- Title & Subtitle -->
  <text x="276" y="150" fill="#f1f7e9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">CodexMonitor</text>
  <text x="276" y="188" fill="#a8c5b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
    Privacy-first local token usage analytics &amp; reasoning cap alerts for Codex
  </text>

  <!-- Feature Pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600">
    <rect x="276" y="218" width="154" height="32" rx="8" fill="#132b21" stroke="#295342" />
    <text x="353" y="239" fill="#d9ece2" text-anchor="middle">127.0.0.1 Loopback</text>

    <rect x="442" y="218" width="156" height="32" rx="8" fill="#132b21" stroke="#295342" />
    <text x="520" y="239" fill="#d9ece2" text-anchor="middle">OTLP Logs :4318</text>

    <rect x="610" y="218" width="166" height="32" rx="8" fill="#132b21" stroke="#295342" />
    <text x="693" y="239" fill="#c6f36b" text-anchor="middle">518n - 2 Rule Alert</text>
  </g>

  <!-- Right Side Telemetry Preview Card -->
  <rect x="816" y="52" width="332" height="216" rx="16" fill="#0b1813" stroke="url(#card-border)" stroke-width="1.5" />
  <circle cx="842" cy="78" r="5" fill="#4fc68b" />
  <text x="856" y="82" fill="#8eb4a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">DASHBOARD · 127.0.0.1:4319</text>
  <line x1="836" y1="96" x2="1128" y2="96" stroke="#1b382c" stroke-width="1" />

  <!-- Metrics inside card -->
  <rect x="836" y="110" width="138" height="62" rx="10" fill="#12271f" stroke="#214637" />
  <text x="850" y="130" fill="#82a897" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">REASONING TOKENS</text>
  <text x="850" y="157" fill="#c6f36b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">516</text>
  <text x="902" y="156" fill="#4fc68b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">n = 1</text>

  <rect x="990" y="110" width="138" height="62" rx="10" fill="#12271f" stroke="#214637" />
  <text x="1004" y="130" fill="#82a897" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">PRIVACY FILTER</text>
  <text x="1004" y="156" fill="#f1f7e9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">Allowlist Only</text>

  <!-- Alert bar inside card -->
  <rect x="836" y="186" width="292" height="62" rx="10" fill="#162f24" stroke="#356f57" />
  <text x="852" y="210" fill="#c6f36b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700">Suspected Reasoning Cap Pattern</text>
  <text x="852" y="232" fill="#b7d2c5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">reasoning_output_tokens = 518n - 2</text>
</svg>
