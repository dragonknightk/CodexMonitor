name: Release signed native packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APPIMAGE_EXTRACT_AND_RUN: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Full release gate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@11.13.0
          test "$(pnpm --version)" = "11.13.0"

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux desktop and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
          pnpm --dir web exec playwright install --with-deps chromium

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust verification inputs
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: release-verification
          cache-on-failure: true

      - name: Install pinned Rust audit tools
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks" version

      - name: Run complete repository verification
        run: pnpm verify

      - name: Run complete dependency and security audit
        run: pnpm audit:security

  package:
    name: Signed release package (${{ matrix.platform }} ${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            bundles: null
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: macos-15
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm

    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed when Windows signing credentials are absent
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          foreach ($name in @(
            "WINDOWS_CERTIFICATE_BASE64",
            "WINDOWS_CERTIFICATE_PASSWORD",
            "WINDOWS_TIMESTAMP_URL"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required Windows release credential '$name' is missing"
            }
          }

      - name: Fail closed when macOS signing credentials are absent
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          for name in \
            APPLE_CERTIFICATE_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_PRIVATE_KEY_BASE64; do
            if test -z "${!name}"; then
              echo "Required macOS release credential '$name' is missing" >&2
              exit 1
            fi
          done

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack install --global pnpm@11.13.0
          test "$(pnpm --version)" = "11.13.0"

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag and version authorities
        id: version
        shell: bash
        run: node scripts/release/check-release-version.mjs --tag "${{ github.ref_name }}"

      - name: Install pinned Rust target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
          test "$(rustc --version | awk '{print $2}')" = "1.97.0"

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Install Linux packaging and desktop dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            dbus-x11 \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            xauth \
            xdg-utils \
            xvfb

      - name: Build Dashboard assets
        run: pnpm --dir web build

      - name: Verify pinned Tauri CLI
        shell: bash
        run: test "$(pnpm exec tauri --version)" = "tauri-cli 2.11.4"

      - name: Build application executable before exposing signing credentials
        shell: bash
        env:
          CODEX_MONITOR_BUILD_CHANNEL: production
        run: >-
          pnpm exec tauri build
          --ci
          --target "${{ matrix.target }}"
          --no-bundle
          --config apps/desktop/src-tauri/tauri.conf.json
          --
          --locked

      - name: Prepare ephemeral Windows signing material
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "codexmonitor-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )

      - name: Prepare ephemeral macOS signing material
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/codexmonitor-signing.p12"
          api_key_path="$RUNNER_TEMP/codexmonitor-notary-key.p8"
          keychain_path="$RUNNER_TEMP/codexmonitor-signing.keychain-db"
          original_keychain_file="$RUNNER_TEMP/codexmonitor-original-keychain.txt"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | /usr/bin/base64 -D >"$certificate_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D >"$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          original_keychain="$(security default-keychain -d user | tr -d '"')"
          printf '%s' "$original_keychain" >"$original_keychain_file"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$original_keychain"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" |
            grep --fixed-strings --quiet "\"$APPLE_SIGNING_IDENTITY\""

      - name: Authenticode-sign the Windows portable executable
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PATH: ${{ runner.temp }}/codexmonitor-signing.pfx
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $targetDirectory = Join-Path $env:GITHUB_WORKSPACE "target/${{ matrix.target }}/release"
          $candidates = @(
            (Join-Path $targetDirectory "codex-monitor.exe"),
            (Join-Path $targetDirectory "codex-monitor-desktop.exe")
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          if ($candidates.Count -ne 1) {
            throw "Expected exactly one Windows application executable, found $($candidates.Count)"
          }
          & "scripts/release/sign-windows.ps1" -BinaryPath $candidates[0]

      - name: Bundle Developer ID signed and notarized macOS packages
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/codexmonitor-notary-key.p8
        run: >-
          pnpm exec tauri bundle
          --ci
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --config apps/desktop/src-tauri/tauri.conf.json

      - name: Bundle Linux packages
        if: matrix.platform == 'linux'
        shell: bash
        run: >-
          pnpm exec tauri bundle
          --ci
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --no-sign
          --config apps/desktop/src-tauri/tauri.conf.json

      - name: Stage strict release artifact set
        id: stage
        shell: bash
        run: >-
          node scripts/release/stage-artifacts.mjs
          --channel release
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --target "${{ matrix.target }}"
          --target-dir "target/${{ matrix.target }}/release"
          --output release-staging

      - name: Notarize and staple signed macOS disk image
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/codexmonitor-notary-key.p8
        run: |
          xcrun notarytool submit "${{ steps.stage.outputs.dmg_path }}" \
            --issuer "$APPLE_API_ISSUER" \
            --key-id "$APPLE_API_KEY" \
            --key "$APPLE_API_KEY_PATH" \
            --wait
          xcrun stapler staple "${{ steps.stage.outputs.dmg_path }}"

      - name: Verify Windows portable executable signature and timestamp
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath "${{ steps.stage.outputs.executable_path }}"
          if ($signature.Status -ne "Valid") {
            throw "Release executable failed Authenticode verification"
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw "Release executable is missing an Authenticode timestamp"
          }

      - name: Verify macOS Developer ID signature and notarization tickets
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 "${{ steps.stage.outputs.app_bundle_path }}"
          spctl --assess --type execute --verbose=2 "${{ steps.stage.outputs.app_bundle_path }}"
          xcrun stapler validate "${{ steps.stage.outputs.app_bundle_path }}"
          xcrun stapler validate "${{ steps.stage.outputs.dmg_path }}"

      - name: Verify Linux WebKitGTK package and runtime dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          deb_depends="$(dpkg-deb --field "${{ steps.stage.outputs.deb_path }}" Depends)"
          printf '%s\n' "$deb_depends"
          grep -Eiq 'webkit2gtk[^[:space:],)]*4[._-]?1' <<<"$deb_depends"

          rpm_requires="$(rpm -qp --requires "${{ steps.stage.outputs.rpm_path }}")"
          printf '%s\n' "$rpm_requires"
          grep -Eiq 'webkit2gtk[^[:space:],)]*4[._-]?1' <<<"$rpm_requires"

          file "${{ steps.stage.outputs.appimage_path }}" | grep -q 'ELF'
          ldd_output="$(ldd "${{ steps.stage.outputs.executable_path }}")"
          printf '%s\n' "$ldd_output"
          if grep -q 'not found' <<<"$ldd_output"; then
            echo "Linux application has unresolved dynamic dependencies" >&2
            exit 1
          fi
          grep -Eq 'libwebkit2gtk-4\.1\.so' <<<"$ldd_output"

      - name: Extract Windows portable ZIP into two isolated directories
        if: matrix.platform == 'windows'
        id: installed-windows
        shell: pwsh
        run: |
          $portableRoots = @(
            (Join-Path $env:RUNNER_TEMP "CodexMonitorPortablePrimary"),
            (Join-Path $env:RUNNER_TEMP "CodexMonitorPortableSecondary")
          )
          $executables = @()
          foreach ($portableRoot in $portableRoots) {
            if (Test-Path -LiteralPath $portableRoot) {
              throw "Isolated Windows portable path already exists: $portableRoot"
            }
            Expand-Archive -LiteralPath "${{ steps.stage.outputs.portable_zip_path }}" -DestinationPath $portableRoot
            $executable = Join-Path $portableRoot "codex-monitor.exe"
            $files = @(Get-ChildItem -LiteralPath $portableRoot -Recurse -File)
            if ($files.Count -ne 1 -or $files[0].FullName -ne $executable) {
              throw "Windows portable ZIP must contain only codex-monitor.exe at its root"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $executable
            if ($signature.Status -ne "Valid" -or $null -eq $signature.TimeStamperCertificate) {
              throw "Extracted Windows portable executable is not signed and timestamped"
            }
            $executables += $executable
          }
          "primary_executable_path=$($executables[0])" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "secondary_executable_path=$($executables[1])" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Clear Windows platform registration before portable smoke
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "${{ steps.installed-windows.outputs.primary_executable_path }}" --cleanup-platform-registration
          if ($LASTEXITCODE -ne 0) {
            throw "Windows platform registration cleanup failed before portable smoke"
          }

      - name: Copy primary macOS app into isolated Applications-like path
        if: matrix.platform == 'macos'
        id: installed-macos
        shell: bash
        run: |
          install_root="$RUNNER_TEMP/CodexMonitor Applications"
          installed_app="$install_root/CodexMonitor.app"
          test ! -e "$install_root"
          mkdir -p "$install_root"
          ditto "${{ steps.stage.outputs.app_bundle_path }}" "$installed_app"
          executable="$installed_app/Contents/MacOS/codex-monitor"
          test -x "$executable"
          printf 'executable_path=%s\n' "$executable" >>"$GITHUB_OUTPUT"

      - name: Copy primary Linux AppImage into isolated stable path
        if: matrix.platform == 'linux'
        id: installed-linux
        shell: bash
        run: |
          install_root="$RUNNER_TEMP/codexmonitor-installed"
          executable="$install_root/CodexMonitor.AppImage"
          test ! -e "$install_root"
          mkdir -p "$install_root"
          cp "${{ steps.stage.outputs.appimage_path }}" "$executable"
          chmod 755 "$executable"
          printf 'executable_path=%s\n' "$executable" >>"$GITHUB_OUTPUT"

      - name: Run primary installed Windows smoke contract with notification requirement
        if: matrix.platform == 'windows'
        run: >-
          node scripts/installed-artifact-smoke.mjs
          --executable "${{ steps.installed-windows.outputs.primary_executable_path }}"
          --require-notifications

      - name: Run secondary installed Windows smoke contract with notification requirement
        if: matrix.platform == 'windows'
        run: >-
          node scripts/installed-artifact-smoke.mjs
          --executable "${{ steps.installed-windows.outputs.secondary_executable_path }}"
          --require-notifications

      - name: Verify Windows notification shortcut follows secondary portable executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $shortcutPath = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\CodexMonitor\CodexMonitor.lnk"
          if (-not (Test-Path -LiteralPath $shortcutPath -PathType Leaf)) {
            throw "Windows notification shortcut was not registered"
          }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
          $expected = [IO.Path]::GetFullPath("${{ steps.installed-windows.outputs.secondary_executable_path }}")
          $actual = [IO.Path]::GetFullPath($shortcut.TargetPath)
          if (-not [string]::Equals($actual, $expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Windows notification shortcut target does not match the secondary portable executable"
          }

      - name: Run installed macOS smoke contract
        if: matrix.platform == 'macos'
        run: >-
          node scripts/installed-artifact-smoke.mjs
          --executable "${{ steps.installed-macos.outputs.executable_path }}"

      - name: Run installed Linux smoke contract
        if: matrix.platform == 'linux'
        shell: bash
        run: >-
          dbus-run-session --
          xvfb-run -a
          node scripts/installed-artifact-smoke.mjs
          --executable "${{ steps.installed-linux.outputs.executable_path }}"

      - name: Run installed Linux degraded smoke with a fresh isolated profile
        if: matrix.platform == 'linux'
        shell: bash
        run: >-
          dbus-run-session --
          xvfb-run -a
          node scripts/installed-artifact-smoke.mjs
          --executable "${{ steps.installed-linux.outputs.executable_path }}"
          --linux-degraded

      - name: Generate pinned CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          file: ${{ steps.stage.outputs.executable_path }}
          format: cyclonedx-json
          output-file: ${{ steps.stage.outputs.sbom_path }}
          syft-version: v1.46.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Verify release artifact allowlist
        shell: bash
        run: >-
          node scripts/release/verify-artifacts.mjs
          --scope target
          --root release-staging
          --channel release
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"

      - name: Attest application payload build provenance
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: ${{ github.workspace }}/release-staging/installers/*

      - name: Attest application payload SBOM
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999
        with:
          subject-path: ${{ github.workspace }}/release-staging/installers/*
          sbom-path: ${{ steps.stage.outputs.sbom_path }}

      - name: Upload verified release inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ steps.stage.outputs.artifact_name }}-release-input
          path: |
            release-staging/installers
            release-staging/metadata
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove Windows platform registration after portable smoke
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $executable = Join-Path $env:RUNNER_TEMP "CodexMonitorPortableSecondary\codex-monitor.exe"
          if (Test-Path -LiteralPath $executable -PathType Leaf) {
            & $executable --cleanup-platform-registration
            if ($LASTEXITCODE -ne 0) {
              throw "Windows platform registration cleanup failed after portable smoke"
            }
          }

      - name: Remove isolated Windows portable extractions
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          foreach ($name in @("CodexMonitorPortablePrimary", "CodexMonitorPortableSecondary")) {
            $installRoot = [IO.Path]::GetFullPath((Join-Path $runnerTemp $name))
            $relative = [IO.Path]::GetRelativePath($runnerTemp, $installRoot)
            if ($relative.StartsWith("..", [StringComparison]::Ordinal) -or [IO.Path]::IsPathRooted($relative)) {
              throw "Refusing to clean a Windows path outside RUNNER_TEMP"
            }
            if (Test-Path -LiteralPath $installRoot) {
              Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Remove isolated macOS smoke installation
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: rm -rf "$RUNNER_TEMP/CodexMonitor Applications"

      - name: Remove isolated Linux smoke installation
        if: always() && matrix.platform == 'linux'
        shell: bash
        run: rm -rf "$RUNNER_TEMP/codexmonitor-installed"

      - name: Remove ephemeral Windows signing material
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          @(
            (Join-Path $env:RUNNER_TEMP "codexmonitor-signing.pfx")
          ) | ForEach-Object {
            Remove-Item -LiteralPath $_ -Force -ErrorAction SilentlyContinue
          }

      - name: Remove ephemeral macOS signing material
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/codexmonitor-signing.keychain-db"
          original_keychain_file="$RUNNER_TEMP/codexmonitor-original-keychain.txt"
          if test -s "$original_keychain_file"; then
            original_keychain="$(cat "$original_keychain_file")"
            security default-keychain -d user -s "$original_keychain" || true
            security list-keychains -d user -s "$original_keychain" || true
          fi
          security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/codexmonitor-signing.p12" \
            "$RUNNER_TEMP/codexmonitor-notary-key.p8" \
            "$original_keychain_file"

  assemble:
    name: Assemble strict release set
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.0

      - name: Validate release tag and version
        id: version
        run: node scripts/release/check-release-version.mjs --tag "${{ github.ref_name }}"

      - name: Download release inputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: codexmonitor-v${{ steps.version.outputs.version }}-*-release-input
          path: release-input
          merge-multiple: true

      - name: Flatten and validate exact release inputs
        run: >-
          node scripts/release/collect-release.mjs
          --input release-input
          --output release-final
          --version "${{ steps.version.outputs.version }}"

      - name: Write stable release SHA-256 checksums
        run: >-
          node scripts/release/write-checksums.mjs
          --root release-final
          --output "release-final/CodexMonitor-v${{ steps.version.outputs.version }}-SHA256SUMS"

      - name: Verify exact release assets and checksums
        run: >-
          node scripts/release/verify-artifacts.mjs
          --scope release
          --root release-final

      - name: Upload verified release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: codexmonitor-v${{ steps.version.outputs.version }}-release-candidate
          path: release-final
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish verified GitHub release
    needs: assemble
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.0

      - name: Validate release tag and version
        id: version
        run: node scripts/release/check-release-version.mjs --tag "${{ github.ref_name }}"

      - name: Download verified release candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: codexmonitor-v${{ steps.version.outputs.version }}-release-candidate
          path: release-final

      - name: Reverify exact release assets
        run: >-
          node scripts/release/verify-artifacts.mjs
          --scope release
          --root release-final

      - name: Create draft, upload exact allowlist, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $tag; refusing to overwrite it" >&2
            exit 1
          fi

          gh release create "$tag" \
            --draft \
            --verify-tag \
            --title "CodexMonitor $tag" \
            --generate-notes
          gh release upload "$tag" release-final/*

          find release-final -maxdepth 1 -type f -printf '%f\n' |
            LC_ALL=C sort >"$RUNNER_TEMP/expected-release-assets.txt"
          gh release view "$tag" --json assets --jq '.assets[].name' |
            LC_ALL=C sort >"$RUNNER_TEMP/actual-release-assets.txt"
          diff --unified \
            "$RUNNER_TEMP/expected-release-assets.txt" \
            "$RUNNER_TEMP/actual-release-assets.txt"

          gh release edit "$tag" --draft=false
